name: Build Kiro CLI (Termux aarch64)

on:
  workflow_dispatch:
    inputs:
      archive:
        description: 'Formato del artefacto upstream'
        type: choice
        options: [auto, tar.xz, tar.zst, tar.gz, zip]
        default: auto
      publish:
        description: 'Publicar release en GitHub'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'ci/**'
      - 'install.sh'
      - '.github/workflows/build-kiro.yml'
  workflow_call:
    inputs:
      archive:
        type: string
        default: auto
      publish:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-kiro-${{ github.ref }}
  cancel-in-progress: false

env:
  KIRO_TERMUX_REPO: ${{ github.repository }}
  ARCHIVE: ${{ inputs.archive || 'auto' }}

jobs:
  build:
    name: Fetch, verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        run: python3 ci/scripts/test-installer.py

      - name: Verify lock against upstream manifest
        run: python3 ci/scripts/upstream.py verify

      - name: Resolve pinned version and artifact
        id: lock
        run: |
          python3 - <<'PY'
          import json, os
          lock = json.load(open('ci/upstream/kiro-cli.lock.json'))
          art = lock['artifacts'][lock['default_artifact']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"version={lock['version']}\n")
              out.write(f"artifact={art['file']}\n")
              out.write(f"sha256={art['sha256']}\n")
              out.write(f"size={art['size']}\n")
          PY

      - name: Download, verify and extract artifact
        run: |
          python3 ci/scripts/installer.py verify \
            --lock ci/upstream/kiro-cli.lock.json \
            --archive "$ARCHIVE" \
            --no-smoke \
            --stage-dir "$RUNNER_TEMP/stage"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Smoke test under QEMU (aarch64)
        id: smoke
        run: |
          output="$(docker run --rm --platform linux/arm64 \
            -v "$RUNNER_TEMP/stage/extract:/w:ro" -w /w alpine:3.20 \
            sh -c './kirocli/bin/kiro-cli --version')"
          echo "smoke output: $output"
          echo "SMOKE=$output" >> "$GITHUB_ENV"

      - name: Install into a temporary prefix
        env:
          KIRO_TERMUX_TEST_MODE: '1'
          PREFIX_DIR: ${{ runner.temp }}/kiro-prefix
        run: |
          python3 ci/scripts/installer.py install \
            --lock ci/upstream/kiro-cli.lock.json \
            --archive "$ARCHIVE" \
            --stage-dir "$RUNNER_TEMP/stage" \
            --prefix "$PREFIX_DIR" \
            --yes --no-smoke
          test -x "$PREFIX_DIR/bin/kiro-cli"
          test -x "$PREFIX_DIR/libexec/kiro-termux/kiro-cli"
          test -f "$PREFIX_DIR/etc/kiro-termux/receipt.json"
          grep -aq "/proc/self/fd/9" "$PREFIX_DIR/libexec/kiro-termux/kiro-cli"

      - name: Smoke test installed wrapper under QEMU
        env:
          PREFIX_DIR: ${{ runner.temp }}/kiro-prefix
        run: |
          set -euo pipefail
          mkdir -p "$PREFIX_DIR/bin"
          ln -sf /bin/sh "$PREFIX_DIR/bin/sh"
          output="$(docker run --rm --platform linux/arm64 \
            -v "$PREFIX_DIR:$PREFIX_DIR" -w "$PREFIX_DIR" alpine:3.20 \
            "$PREFIX_DIR/bin/kiro-cli" --version)"
          echo "wrapper smoke: $output"
          echo "$output" | grep -q "kiro-cli"

      - name: Package installer bundle
        run: |
          set -euo pipefail
          VERSION="${{ steps.lock.outputs.version }}"
          mkdir -p dist/ci/scripts dist/ci/upstream
          cp install.sh dist/
          cp ci/scripts/installer.py ci/scripts/upstream.py ci/scripts/env.sh dist/ci/scripts/
          cp ci/upstream/kiro-cli.lock.json dist/ci/upstream/
          python3 ci/scripts/installer.py manifest --lock ci/upstream/kiro-cli.lock.json > dist/manifest.json
          cat > dist/NOTES.md <<EOF
          # Kiro CLI ${VERSION} para Termux (aarch64)

          Empaquetado del binario oficial **estatico musl** de Kiro CLI para Termux/Android.

          ## Instalacion

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${KIRO_TERMUX_REPO}/main/install.sh | sh
          \`\`\`

          ## Datos del artefacto

          - Version upstream: \`${VERSION}\`
          - Archivo: \`${{ steps.lock.outputs.artifact }}\`
          - sha256: \`${{ steps.lock.outputs.sha256 }}\`
          - Smoke test (qemu aarch64): \`${SMOKE}\`
          EOF
          tar -czf "dist/kiro-termux-installer-${VERSION}.tar.gz" -C dist install.sh ci
          (cd dist && sha256sum manifest.json "kiro-termux-installer-${VERSION}.tar.gz" NOTES.md > SHA256SUMS)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiro-termux-${{ steps.lock.outputs.version }}
          path: |
            dist/manifest.json
            dist/kiro-termux-installer-*.tar.gz
            dist/SHA256SUMS
            dist/NOTES.md
          if-no-files-found: error

      - name: Publish release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/kiro-cli-v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.lock.outputs.version }}"
          tag="kiro-cli-v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/manifest.json dist/kiro-termux-installer-*.tar.gz dist/SHA256SUMS dist/NOTES.md --clobber
          else
            gh release create "$tag" dist/manifest.json dist/kiro-termux-installer-*.tar.gz dist/SHA256SUMS dist/NOTES.md \
              --title "Kiro CLI ${VERSION} (Termux aarch64)" \
              --notes-file dist/NOTES.md
          fi

      - name: Write CI summary
        if: always()
        env:
          VERSION: ${{ steps.lock.outputs.version }}
          ARTIFACT: ${{ steps.lock.outputs.artifact }}
          SHA256: ${{ steps.lock.outputs.sha256 }}
          UPDATE_AVAILABLE: 'ver upstream.py status'
        run: source ci/scripts/ci-summary.sh && ci_summary
